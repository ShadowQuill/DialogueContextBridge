<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="14" y="14" width="172" height="172" rx="38" fill="url(#g)"/>
  <rect x="14" y="14" width="172" height="172" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- left conversation node -->
  <circle cx="62" cy="70" r="20" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="55" cy="64" r="4.5" fill="#6366f1"/>
  <circle cx="67" cy="64" r="4.5" fill="#6366f1"/>
  <circle cx="55" cy="76" r="4.5" fill="#6366f1"/>
  <circle cx="67" cy="76" r="4.5" fill="#6366f1"/>

  <!-- right conversation node -->
  <circle cx="138" cy="130" r="20" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="131" cy="124" r="4.5" fill="#10b981"/>
  <circle cx="143" cy="124" r="4.5" fill="#10b981"/>
  <circle cx="131" cy="136" r="4.5" fill="#10b981"/>
  <circle cx="143" cy="136" r="4.5" fill="#10b981"/>

  <!-- bridge arc connecting the two sessions -->
  <path d="M82,68 C104,40 116,40 118,112" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
  <path d="M82,72 C104,48 116,48 118,108" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- small link ticks on the bridge -->
  <line x1="96" y1="55" x2="104" y2="55" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="100" y1="68" x2="108" y2="68" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- wordmark -->
  <text x="100" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.92">DCB</text>
</svg>
